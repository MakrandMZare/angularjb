<main class="verified-screen">
  <section class="verified-content" aria-labelledby="verified-title">
    <img class="brand-mark" src="/assets/logo/jb_logo_1.png" alt="JanBazar" />

    <div class="success-mark" aria-hidden="true">
      <svg viewBox="0 0 48 48" focusable="false">
        <path d="m10 24 9 9L38 13" />
      </svg>
    </div>

    <h1 id="verified-title">Verified</h1>
    <p class="verified-description">One last step to finish</p>

    <label class="terms-card">
      <input type="checkbox" (change)="onTermsChange($event)" />
      <span class="checkbox-mark" aria-hidden="true"></span>
      <span class="terms-copy">
        I agree to the <span class="terms-link">Terms and Conditions</span>
      </span>
    </label>

    <button
      class="create-account-button"
      type="button"
      [disabled]="!termsAccepted()"
      (click)="createAccount()"
    >
      Create account
    </button>
  </section>
</main>
