<main class="services-screen">
  <div class="services-layout">
    <div class="logo-frame">
      <img src="/assets/logo/jb_logo_1.png" alt="J shopping cart logo" />
    </div>

    <header class="welcome-header">
      <div class="user-greeting">
        <div class="user-avatar" aria-hidden="true">{{ username().charAt(0).toUpperCase() }}</div>
        <p>Welcome,<strong>{{ username() }}</strong></p>
      </div>
      <button
        class="notification-button"
        type="button"
        aria-label="Notifications"
        (click)="showNotificationsComingSoon()"
      >
        <mat-icon fontSet="material-symbols-outlined" aria-hidden="true">notifications</mat-icon>
        <span class="notification-dot" aria-hidden="true"></span>
      </button>
    </header>

    <section class="service-section" aria-labelledby="services-title">
      <p class="eyebrow">
        <mat-icon fontSet="material-symbols-outlined" aria-hidden="true">auto_awesome</mat-icon>
        YOUR JANBAZAR
      </p>
      <h1 id="services-title">Explore Services</h1>
      <p class="section-description">Discover trusted services for your everyday needs.</p>

      <div class="service-grid">
        @for (category of categories; track category.name) {
          <button
            class="service-item"
            type="button"
            (click)="openCategory(category)"
            [attr.aria-label]="category.name"
          >
            <span class="service-art" aria-hidden="true">
              <mat-icon fontSet="material-symbols-outlined">{{ category.icon }}</mat-icon>
            </span>
            <span class="service-name">{{ category.name }}</span>
            <mat-icon
              class="service-arrow"
              fontSet="material-symbols-outlined"
              aria-hidden="true"
            >
              arrow_outward
            </mat-icon>
          </button>
        }
      </div>
    </section>

    @if (statusMessage()) {
      <p class="status-message" role="status">{{ statusMessage() }}</p>
    }

    <app-bottom-nav (notificationRequested)="showNotificationsComingSoon()" />
  </div>
</main>
